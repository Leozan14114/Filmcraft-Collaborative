# Builds FilmCraft for Windows (x86_64) on a GitHub-hosted Windows machine.
# Run it by hand: repository > Actions > "Windows build" > Run workflow.
# The result is a downloadable artifact: filmcraft-windows-x86_64.zip (filmcraft.exe + filmcraft-cli.exe).
name: Windows build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.95 --profile minimal
          rustup default 1.95
          rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: Build
        shell: pwsh
        run: cargo build --release --locked -p filmcraft -p filmcraft-cli

      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target/release/filmcraft.exe, target/release/filmcraft-cli.exe out/
          Copy-Item LICENSE-MIT, LICENSE-APACHE, NOTICE out/

      - uses: actions/upload-artifact@v7
        with:
          name: filmcraft-windows-x86_64
          path: out/*
